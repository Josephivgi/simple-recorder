<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; font-src 'self'; script-src 'self'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Recorder bar</title>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div class="countdown-card" data-mode="timer">
      <div class="record-bar" data-overlay-bar role="toolbar" aria-label="Recorder">
        <button type="button" class="record-bar-go" data-overlay-start><i class="go-dot" aria-hidden="true"></i><span data-overlay-go-label>Record</span></button>

        <div class="record-bar-field" role="group" aria-label="Start delay">
          <span class="field-name">Delay</span>
          <button type="button" data-overlay-delay-down aria-label="Less delay">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
              <path fill="currentColor" d="M3 7.25h10v1.5H3z" />
            </svg>
          </button>
          <span data-overlay-delay>Off</span>
          <button type="button" data-overlay-delay-up aria-label="More delay">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
              <path fill="currentColor" d="M7.25 3h1.5v4.25H13v1.5H8.75V13h-1.5V8.75H3v-1.5h4.25z" />
            </svg>
          </button>
        </div>

        <div class="record-bar-field" role="group" aria-label="Frame rate">
          <span class="field-name">FPS</span>
          <button type="button" data-overlay-fps-down aria-label="Lower frame rate">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
              <path fill="currentColor" d="M3 7.25h10v1.5H3z" />
            </svg>
          </button>
          <span data-overlay-fps>30</span>
          <button type="button" data-overlay-fps-up aria-label="Higher frame rate">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
              <path fill="currentColor" d="M7.25 3h1.5v4.25H13v1.5H8.75V13h-1.5V8.75H3v-1.5h4.25z" />
            </svg>
          </button>
        </div>

        <div class="record-bar-target" role="group" aria-label="What to record">
          <button
            type="button"
            data-overlay-target="auto"
            aria-pressed="true"
            title="Record the whole screen you are using"
          >Auto</button>
          <button
            type="button"
            data-overlay-target="area"
            aria-pressed="false"
            title="Drag a box to record only that part, for example to leave out the dock. Click again to redraw."
          >Area<span class="target-size" data-overlay-size></span></button>
          <button
            type="button"
            data-overlay-target="window"
            aria-pressed="false"
            title="Record one window instead of the whole screen"
          >Window<span class="target-size" data-overlay-window-label></span></button>
        </div>

        <button
          type="button"
          class="record-bar-sound"
          data-overlay-sound
          aria-pressed="false"
          aria-label="Sound off"
          title="Sound: include your microphone in the video"
        >
          <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
            <path fill="currentColor" d="M2.6 5.6v4.8h2.5l3.4 3V2.6l-3.4 3z" />
            <path class="sound-waves" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" d="M10.4 5.7a3.2 3.2 0 0 1 0 4.6M12.3 3.9a5.7 5.7 0 0 1 0 8.2" />
            <path class="sound-off-line" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M10.7 6l2.7 4M13.4 6l-2.7 4" />
          </svg>
          <span data-overlay-sound-label>Off</span>
        </button>

        <button
          type="button"
          class="record-bar-shot"
          data-overlay-shot
          aria-label="Take a screenshot"
          title="Screenshot: save a picture of what the take records"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <path fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" d="M2.2 5.2h2.6l1.2-1.8h4l1.2 1.8h2.6v7.6H2.2z" />
            <circle cx="8" cy="8.8" r="2.3" fill="none" stroke="currentColor" stroke-width="1.4" />
          </svg>
        </button>

        <button type="button" class="record-bar-pause" data-overlay-pause aria-pressed="false" aria-label="Pause the take">
          <i class="pause-bars" aria-hidden="true"></i><span data-overlay-pause-label>Pause</span>
        </button>
        <span class="record-bar-clock" data-overlay-clock data-empty="true">
          <span class="live-dot" hidden></span>
          <span data-clock-text></span>
        </span>
        <button type="button" class="record-bar-stop" data-overlay-stop><i class="stop-square" aria-hidden="true"></i>Stop</button>
        <button
          type="button"
          class="record-bar-close"
          data-overlay-close
          aria-label="Close the recorder bar"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
            <path
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="square"
              d="M3.5 3.5l9 9M12.5 3.5l-9 9"
            />
          </svg>
        </button>
      </div>
      <span data-overlay-label>Starts in</span>
      <p data-record-countdown role="timer">0:00</p>
    </div>
    <div class="area-pick" data-area-pick hidden>
      <div class="area-pick-box" data-area-box hidden><span class="area-pick-size" data-area-size></span></div>
      <p class="area-pick-hint" data-area-hint>Drag a box around what to record, or click one corner and then the other. Leave out the dock or taskbar.</p>
      <button type="button" class="area-pick-cancel" data-area-cancel>Cancel</button>
    </div>
    <div class="win-pick" data-win-pick hidden>
      <div class="win-pick-card">
        <p class="win-pick-hint">Pick a window to record.</p>
        <div class="win-pick-grid" data-win-grid></div>
        <button type="button" class="area-pick-cancel" data-win-cancel>Cancel</button>
      </div>
    </div>
    <script src="overlay.js"></script>
  </body>
</html>
