<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250" font-family="Segoe UI, system-ui, sans-serif">
  <title>If Windows protected your PC appears, click More info, then Run anyway</title>
  <g>
    <rect x="0" y="0" width="350" height="250" rx="6" fill="#0067b8"/>
    <text x="22" y="42" font-size="19" fill="#ffffff">Windows protected your PC</text>
    <text x="22" y="76" font-size="12" fill="#e5effa">Microsoft Defender SmartScreen prevented an</text>
    <text x="22" y="93" font-size="12" fill="#e5effa">unrecognized app from starting. Running this</text>
    <text x="22" y="110" font-size="12" fill="#e5effa">app might put your PC at risk.</text>
    <rect x="16" y="124" width="76" height="26" rx="4" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="24" y="142" font-size="13" font-weight="600" fill="#ffffff" text-decoration="underline">More info</text>
    <rect x="232" y="202" width="100" height="30" fill="#e1e1e1"/>
    <text x="282" y="222" font-size="13" fill="#1d2430" text-anchor="middle">Don't run</text>
  </g>
  <g transform="translate(370 0)">
    <rect x="0" y="0" width="350" height="250" rx="6" fill="#0067b8"/>
    <text x="22" y="42" font-size="19" fill="#ffffff">Windows protected your PC</text>
    <text x="22" y="76" font-size="12" fill="#e5effa">Microsoft Defender SmartScreen prevented an</text>
    <text x="22" y="93" font-size="12" fill="#e5effa">unrecognized app from starting.</text>
    <text x="22" y="128" font-size="12" fill="#e5effa">App:        SimpleRecorder-Setup.exe</text>
    <text x="22" y="148" font-size="12" fill="#e5effa">Publisher: Unknown publisher</text>
    <rect x="118" y="202" width="104" height="30" fill="#e1e1e1" stroke="#ffffff" stroke-width="3"/>
    <text x="170" y="222" font-size="13" font-weight="600" fill="#1d2430" text-anchor="middle">Run anyway</text>
    <rect x="232" y="202" width="100" height="30" fill="#e1e1e1"/>
    <text x="282" y="222" font-size="13" fill="#1d2430" text-anchor="middle">Don't run</text>
  </g>
</svg>
